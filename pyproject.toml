[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-host-mcp"
version = "1.0.0"
description = "MCP service for auditable materials-science literature research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.21",
    "requests>=2.28",
]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.0",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
sci-host-mcp = "sci_host.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
